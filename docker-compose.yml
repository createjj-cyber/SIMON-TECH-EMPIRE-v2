version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: simon_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - simon_network

  redis:
    image: redis:7-alpine
    container_name: simon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simon_network
    command: redis-server --appendonly yes

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simon_app
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/simon-tech-empire
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs
      - ./storage:/app/storage
    networks:
      - simon_network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  simon_network:
    driver: bridge
